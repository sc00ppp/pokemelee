name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ".[art]"
      - if: runner.os == 'Windows'
        run: python -m pokemelee fetch-tools --tool xdelta --platform win-x64
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xdelta3
      - run: python -m unittest discover -s tests -v
        env:
          POKEMELEE_TEST_XDELTA: '1'
      - run: python tools/check_source.py
