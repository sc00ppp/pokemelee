[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemelee-builder"
version = "0.1.0"
description = "Source-only PokéMelee build tooling for user-supplied GameCube discs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
art = ["Pillow==11.2.1", "numpy==2.2.6"]
stages = ["Pillow==11.2.1", "numpy==2.2.6", "scipy==1.16.0"]

[project.scripts]
pokemelee = "pokemelee.cli:main"

[tool.setuptools]
packages = ["pokemelee"]

[tool.setuptools.package-data]
pokemelee = ["recipes/*.json", "recipes/stages/*.json", "recipes/references/*.json", "dependencies.lock.json", "native/*.csproj", "native/*.cs", "native/*.py", "native/*/*.cs", "native/*/*.c"]
